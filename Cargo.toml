[package]
name = "asher-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
fault-injection = []

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "orchestrator"
path = "src/bin/orchestrator.rs"
